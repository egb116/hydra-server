# Keeps this fork's main branch merged with dmilin1/hydra-server.
# The Cloudflare Worker lives entirely in worker/, which upstream never
# touches, so these merges normally go through without conflicts.
name: Sync upstream

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'dmilin1/hydra-server'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main 2>&1)
          status=$?
          echo "$out"
          {
            echo "output<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Explain the failure in the job summary
        if: failure() && steps.merge.outcome == 'failure'
        env:
          OUTPUT: ${{ steps.merge.outputs.output }}
        run: |
          {
            echo "## Upstream sync failed"
            echo
            echo "The daily merge from dmilin1/hydra-server failed:"
            echo
            echo '```'
            echo "$OUTPUT"
            echo '```'
            echo
            echo "If upstream changed files under \`.github/workflows\`, GitHub does not let the Actions token push them: press **Sync fork** on the repo page instead. If there is a merge conflict, merge \`upstream/main\` locally and resolve it."
          } >> "$GITHUB_STEP_SUMMARY"
