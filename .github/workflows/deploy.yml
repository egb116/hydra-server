# Deploys the official server to Fly.io after CI passes on a push to main.
#
# Off until you turn it on. To turn it on:
#   1. Create a deploy token: fly tokens create deploy -x 8760h
#   2. Add it as the repository secret FLY_API_TOKEN.
#   3. Add the repository variable FLY_AUTO_DEPLOY with the value true.
# To turn it off again, delete the variable or set it to anything else.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    if: >-
      vars.FLY_AUTO_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The commit CI tested, not whatever main points at by now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # The server posts "Hydra server is live" to Discord with this commit once it's up.
      # The message goes through env, never into the script itself, so a commit title
      # can't inject shell code.
      - name: Deploy
        run: |
          title="${COMMIT_MESSAGE%%$'\n'*}"
          flyctl deploy --remote-only --env "HYDRA_COMMIT=$COMMIT_SHA" --env "HYDRA_COMMIT_TITLE=$title"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
