# Like compose.yaml, but builds from this checkout (for testing local changes):
#   docker compose -f compose.dev.yaml up --build
services:
  hydra-server:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      # The SQLite database and its backups. The container gives ./data to uid 1000 on start.
      - ./data:/data
    env_file:
      - .env
    environment:
      HYDRA_MODE: selfhost
    restart: unless-stopped
    stop_grace_period: 30s
